<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Primary SEO & social metadata -->
    <title>Charles Daniel Garcia — Web Designer & Front-end Developer</title>
    <meta name="description" content="Charles Daniel Garcia — student web designer and front-end developer building responsive, accessible websites. Open to internships and freelance opportunities." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://your-domain.example/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f1724" />
    <!-- Theme-aware favicon: default will be set by script below -->
    <link id="theme-favicon" rel="icon" type="image/svg+xml" href="/favicon-black.svg" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Charles Garcia" />
    <meta property="og:title" content="Charles Daniel Garcia — Web Designer & Front-end Developer" />
    <meta property="og:description" content="Student web designer and front-end developer building responsive, accessible websites. Open to internships and freelance work." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.example/" />
    <meta property="og:image" content="/profile.JPG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charles Daniel Garcia — Web Designer & Front-end Developer" />
    <meta name="twitter:description" content="Student web designer and front-end developer building responsive, accessible websites. Open to internships and freelance work." />
    <meta name="twitter:image" content="/profile.JPG" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        // Apply saved theme early so initial render matches user's choice.
        try {
          const saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
            return;
          }
        } catch (e) {
          // ignore localStorage errors
        }

        // fallback to system preference (apply only the theme, not the favicon)
        const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Favicon follows system preference only (not site theme/localStorage).
        const favicon = document.getElementById('theme-favicon');
        if (!favicon) return;
        const setIcon = (isDark) => {
          favicon.setAttribute('href', isDark ? '/favicon-white.svg' : '/favicon-black.svg');
        };
        const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        setIcon(mq && mq.matches);
        if (mq && typeof mq.addEventListener === 'function') {
          mq.addEventListener('change', (e) => setIcon(e.matches));
        } else if (mq && typeof mq.addListener === 'function') {
          mq.addListener((e) => setIcon(e.matches));
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
